name: CI

on:
  push:
    branches:
      - live
  pull_request: ~

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: _tools
        run: npm install

      - name: Assemble and pack
        working-directory: _tools
        run: npx gulp

      - uses: actions/upload-artifact@v4
        with:
          name: PBO-Files
          path: _tools/build/pbo

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install check tooling
        run: |
          pip install -r tools/requirements.txt
          pip install pytest

      # Every check runs even if an earlier one fails (!cancelled()), so a single
      # CI run surfaces ALL issues, not just the first. The job still goes red if
      # any step failed.
      - name: Tooling unit tests
        if: ${{ !cancelled() }}
        run: python -m pytest tools/tests -q

      - name: Taxi SQF decision regressions
        if: ${{ !cancelled() }}
        run: |
          curl --fail --location --retry 3 \
            https://github.com/SQFvm/runtime/releases/download/v2026.04.03-ed9f5f5/sqfvm_linux_x64_gcc.zip \
            --output "$RUNNER_TEMP/sqfvm.zip"
          echo "bb4e3bb415305d2ef2c4cdb75e98f442baea3a4575887c6570a11435a780615b  $RUNNER_TEMP/sqfvm.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/sqfvm.zip" -d "$RUNNER_TEMP/taxi-sqfvm"
          chmod +x "$RUNNER_TEMP/taxi-sqfvm/sqfvm_linux_x64_gcc/sqfvm"
          python tools/run_taxi_sqf_tests.py --sqfvm "$RUNNER_TEMP/taxi-sqfvm/sqfvm_linux_x64_gcc/sqfvm"

      - name: SQF syntax lint (baseline-gated)
        if: ${{ !cancelled() }}
        run: python tools/sqf_lint.py

      - name: Reference integrity
        if: ${{ !cancelled() }}
        run: python tools/refcheck.py

      - name: Namespace key inventory (non-gating artifact)
        if: ${{ !cancelled() }}
        run: python tools/namespace_keys.py --json tools/namespace_keys.json

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: namespace-keys
          path: tools/namespace_keys.json
